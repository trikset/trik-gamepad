# Single source of truth for the app version.
#
# THE ONLY file that stores the release version. Everything else derives from
# it: app/build.gradle reads it to compute versionCode/versionName,
# scripts/version_manager.py syncs the fastlane/F-Droid metadata and tags.
# Bump via `uv run python scripts/version_manager.py bump [minor]`, never by
# hand. See scripts/README.md.
VERSION_MAJOR=2
VERSION_MINOR=44