AutoName: TRIK Gamepad
Description: |-
  Turn your phone or tablet into a gamepad to control a TRIK robot.
  Connect over Wi-Fi, drive with touchpads or phone tilt, trigger
  actions with buttons, and see live video from the robot's camera.
  No account, no internet — just your local Wi-Fi to the robot.

  Available in English, Russian, French, German and Vietnamese.
RepoType: git
Repo: https://github.com/trikset/trik-gamepad.git

