[project]
name = "trik-gamepad-tooling"
version = "0.1.0"
description = "Cross-platform dev tooling for trik-gamepad (gate, pre-commit, docs)"
requires-python = ">=3.9"

[dependency-groups]
dev = [
    "fonttools>=4.50,<5",
    "lizard==1.23.0",
    "mdformat==0.7.21",
    "pillow>=11,<13",
    "pre-commit",
]

[tool.uv]
package = false
