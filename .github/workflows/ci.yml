name: CI

on:
  push:
    branches: [master, 'feat/**', 'fix/**', 'refactor/**']
    tags: ['v*']
  pull_request:
    branches: [master]

# Never run two pushes' builds at once: a stale run finishing after a newer one
# uploads misleading artifacts and wastes runner minutes. Cancel the in-progress
# run when a new push arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and gate suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          # Single-branch no-PR workflow (AGENTS.md): pushes only ever land on
          # feat/global-refresh, never master, so the default read-only cache
          # would make every CI run cold. Write the cache back on this branch.
          cache-read-only: false

      - name: Build debug + androidTest APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest -PpreDexEnable=false --build-cache

      - name: Unit tests + quality gates
        run: >-
          ./gradlew
          test
          lint
          detekt
          spotbugsDebug
          jacocoTestReport
          jacocoTestCoverageVerification
          spotlessCheck
          -PpreDexEnable=false
          --build-cache

      # Hard test-duplication gate. Any cloned block >= 50 tokens in the
      # unit/androidTest sources fails the build (import tokens excluded via
      # .jscpd.json). The logical-SLOC token trend is local-only (gate.py).
      - name: Test duplication gate (jscpd)
        run: npx -y jscpd app/src/test app/src/androidTest --config .jscpd.json --reporters console

      # Translation sync guard (mirror of gate.py; Android lint has no
      # key/format-specifier parity check).
      - name: Translation sync guard
        run: python3 scripts/check_translations.py --sync

      # Device-identifier gate (mirror of gate.py): a physical device's serial/
      # model/IMEI must never reach repo content (AGENTS.md "Repo hygiene").
      - name: Device-identifier gate
        run: python3 scripts/check_device_identifiers.py $(git ls-files | grep -E '\.(kt|java|md|xml|yml|yaml|json|gradle|toml|py)$')

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (API 36)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Required for hardware-accelerated (KVM) emulation on ubuntu-latest;
      # without it the emulator falls back to software emulation (glacial
      # boot, install-commit broken-pipe, and slow flaky tests).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          # Same single-branch write-back reasoning as the build job.
          cache-read-only: false

      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          # aosp_atd retry: the original "aosp_atd + swiftshader NEVER grants
          # focus" finding predates the immersive pre-empt + focus-wait fixes
          # (ci.yml pre-empt, FocusAwareActivityTestRule), so re-test aosp_atd now
          # that focus handling exists. aosp_atd is the headless-optimized image
          # (smaller boot + less render load than pixel_5 default), which also
          # probes the swiftshader render-load theory.
          target: aosp_atd
          arch: x86_64
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            # The gamepad runs immersive (system bars hidden); the first entry
            # pops an ImmersiveModeConfirmation overlay that steals window focus
            # and makes every Espresso interaction time out. Pre-empt it.
            adb wait-for-device
            # Wait for boot to complete; then retry the settings write until the
            # provider accepts it. sys.boot_completed can report 1 while the
            # settings provider is still starting, so a single put is silently
            # lost during a slow headless boot -- which is exactly how the
            # confirmation overlay appears (CI history: two runs failed with
            # focus never granted after the pre-empt appeared to run).
            adb shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 1; done'
            adb shell 'i=0; while [ $i -lt 60 ]; do settings put secure immersive_mode_confirmations confirmed; [ "$(settings get secure immersive_mode_confirmations)" = "confirmed" ] && break; i=$((i+1)); sleep 1; done'
            # Dismiss any keyguard and clear an overlay that may already be up.
            adb shell wm dismiss-keyguard
            adb shell input keyevent 4
            # Retry once on failure. NOTE: reactivecircus/android-emulator-runner
            # runs each `script:` LINE as its own `sh -c`, so the retry must be
            # a single line (no if/fi block, no backslash continuation).
            ./gradlew connectedDebugAndroidTest -PpreDexEnable=false || { echo "instrumented run failed; retrying once"; adb shell am force-stop com.trikset.gamepad2; adb shell 'i=0; while [ $i -lt 60 ]; do settings put secure immersive_mode_confirmations confirmed; [ "$(settings get secure immersive_mode_confirmations)" = "confirmed" ] && break; i=$((i+1)); sleep 1; done'; adb shell wm dismiss-keyguard; ./gradlew connectedDebugAndroidTest -PpreDexEnable=false; }

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: ignore

  publish:
    name: Publish installable APK
    # Only publish once ALL tests (build gate + instrumented) are green, and
    # only on master merges/pushes. Dormant during the single-branch no-PR
    # workflow (nothing pushes to master); activates when a master merge lands.
    needs: [build, instrumented]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build releaseDebug APK (debug-signed, installable)
        run: ./gradlew assembleReleaseDebug -PpreDexEnable=false --build-cache

      - name: Upload APK artifact for early adopters
        uses: actions/upload-artifact@v7
        with:
          name: trik-gamepad-releaseDebug
          path: app/build/outputs/apk/releaseDebug/*.apk
          if-no-files-found: error

  # Signed release APK — ONLY for tagged versions (v*). The F-Droid/reproducible
  # contract: build.gradle signs iff BOTH passwords are set AND the keystore is
  # present at the project root (android-keystorage.p12, gitignored). CI has
  # no keystore, so on tag pushes the maintainer supplies it as a base64 secret
  # (TRIK_GAMEPAD_KEYSTORE_B64); the job restores it, then builds assembleRelease
  # only when all three conditions hold, and uploads the signed APK.
  signed-release:
    name: Signed release APK
    needs: [build, instrumented]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: signed_release
    runs-on: ubuntu-latest
    outputs:
      can-sign: ${{ steps.sign-check.outputs.can-sign }}
    env:
      TRIK_GAMEPAD_STORE_PASSWORD: ${{ secrets.TRIK_GAMEPAD_STORE_PASSWORD }}
      TRIK_GAMEPAD_KEY_PASSWORD: ${{ secrets.TRIK_GAMEPAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Restore keystore from secret
        run: |
          if [ -n "$TRIK_GAMEPAD_KEYSTORE_B64" ]; then
            echo "$TRIK_GAMEPAD_KEYSTORE_B64" | base64 -d > android-keystorage.p12
          fi
        env:
          TRIK_GAMEPAD_KEYSTORE_B64: ${{ secrets.TRIK_GAMEPAD_KEYSTORE_B64 }}

      # Gate 1: the pushed tag MUST match version.properties — a release is
      # signed/tagged by the maintainer's explicit intent; a mismatched tag
      # (e.g. v1.0 on code at 2.5) must never become a release.
      - name: Verify tag matches version.properties
        shell: bash
        run: |
          major=$(sed -n 's/^VERSION_MAJOR=//p' version.properties)
          minor=$(sed -n 's/^VERSION_MINOR=//p' version.properties)
          expected="v${major}.${minor}"
          if [ "$expected" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match version.properties ($expected). Refusing to release."
            exit 1
          fi
          echo "Tag matches version.properties: $expected"

      # Gate 2: sign ONLY when both passwords exist AND the keystore is at the
      # project root. Any missing piece -> skip signing entirely (fall back to
      # the unsigned reproducibility build rather than fail the tag CI).
      - name: Check signing prerequisites
        id: sign-check
        run: |
          if [ -n "$TRIK_GAMEPAD_STORE_PASSWORD" ] && [ -n "$TRIK_GAMEPAD_KEY_PASSWORD" ] && [ -f android-keystorage.p12 ]; then
            echo "can-sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "can-sign=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build signed release APK
        if: steps.sign-check.outputs.can-sign == 'true'
        run: ./gradlew assembleRelease -PpreDexEnable=false --build-cache

      - name: Upload signed release APK
        if: steps.sign-check.outputs.can-sign == 'true'
        uses: actions/upload-artifact@v7
        with:
          # Default artifact label ("artifact"). The file inside keeps its
          # Gradle filename (TRIKGamepad-<version>-API<n>-release.apk), which
          # is the release asset name users see and recognize.
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Report unsigned skip
        if: steps.sign-check.outputs.can-sign != 'true'
        run: |
          echo "::warning::Signed APK skipped on tag ${{ github.ref_name }}: " \
            "set TRIK_GAMEPAD_STORE_PASSWORD + TRIK_GAMEPAD_KEY_PASSWORD secrets " \
            "and TRIK_GAMEPAD_KEYSTORE_B64 to build a signed release APK."
          echo "The unsigned reproducibility build (F-Droid path) still applies."

  # Auto-publish the GitHub release from a signed release tag. Discipline: the
  # annotated/signed tag carries the full release notes (prepared by the
  # release-notes skill as release-<tag>-tag-text.md, embedded via
  # `git tag -s -F`). Line 1 of the tag message = release title; the rest =
  # release body (markdown). The signed APK from signed-release is attached as
  # TRIKGamepad-<version>-API<n>-release.apk. Runs ONLY when signing succeeded.
  publish-release:
    name: Publish GitHub release
    needs: [signed-release]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.signed-release.outputs.can-sign == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download signed APK
        uses: actions/download-artifact@v7
        with:
          # Matches the default label from the upload step ("artifact").
          # download-artifact keeps the file's original Gradle filename.
          name: artifact
          path: release-assets/

      # Tag message -> title (head -1) + body (rest), so the release text is
      # exactly what was reviewed and signed into the tag. Written to temp
      # files, never interpolated through GITHUB_OUTPUT/bash directly (a `$` or
      # double quote in the tag message would otherwise be shell-expanded).
      - name: Extract title and body from tag
        id: notes
        run: |
          git fetch origin tag ${{ github.ref_name }} --no-tags
          git for-each-ref refs/tags/${{ github.ref_name }} --format='%(contents)' > .release-tag-text.md
          sed -n '1p' .release-tag-text.md > .release-tag-title.md
          sed -n '2,$p' .release-tag-text.md > .release-tag-body.md
          if [ ! -s .release-tag-title.md ]; then
            echo "::error::Tag ${{ github.ref_name }} has an empty message; write the release notes via git tag -F first"
            exit 1
          fi
          echo "TITLE: $(cat .release-tag-title.md)"

      # The release is PUBLISHED (not a draft): a signed tag push + signed APK
      # build success is the user's explicit intent to release.
      - name: Publish release
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "$(cat .release-tag-title.md)" \
            --notes-file .release-tag-body.md \
            release-assets/*.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
