## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Mon Jul 24 13:42:05 MSK 2023
org.gradle.jvmargs=-Xmx2048M -Dkotlin.daemon.jvm.options\="-Xmx2048M" --add-modules=jdk.compiler
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
org.gradle.configuration-cache=true
org.gradle.caching=true
# SpotBugs 6.5.11 (latest) still emits ReportingExtension.file(String) deprecated in Gradle 10.
# Suppress to summary: one line per unique warning. Revisit on SpotBugs 6.6+ or Gradle-mandatory
# upgrade (Gradle 10) — the deprecation is in SpotBug's internal reporting config, not our code.
org.gradle.warning.mode=summary

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Reproducible builds: zero build timestamps for F-Droid reproducible build
# compatibility (F-Droid ships the developer-signed APK when hashes match).
android.injected.build.time.zero = true
